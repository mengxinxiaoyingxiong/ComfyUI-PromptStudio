name: Build release zip

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and attach installable zip
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build zip
        run: |
          set -euo pipefail
          NAME="ComfyUI-PromptStudio-${GITHUB_REF_NAME#v}"
          STAGE="/tmp/${NAME}"
          mkdir -p "${STAGE}"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='docs' \
            --exclude='dist' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='data/tags' \
            --exclude='data/tags_config.json' \
            --exclude='.gitignore' \
            --exclude='.comfyignore' \
            --exclude='.gitattributes' \
            ./ "${STAGE}/"
          mkdir -p dist
          (cd /tmp && zip -r "${GITHUB_WORKSPACE}/dist/${NAME}.zip" "${NAME}")
          ls -lh "dist/${NAME}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "Prompt Studio ${{ github.ref_name }}"
          body: |
            ComfyUI Prompt Studio，手动安装包。

            **安装**：解压后把 `ComfyUI-PromptStudio-*` 文件夹放进 `ComfyUI/custom_nodes/`，重启 ComfyUI。
            **Manager**：搜索 `Prompt Studio Editor` 安装。
            **说明**：<https://github.com/mengxinxiaoyingxiong/ComfyUI-PromptStudio#readme>
          files: dist/*.zip
          overwrite_files: true
          generate_release_notes: true
